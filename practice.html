<!DOCTYPE html>
<html>
<head>
    <title>Smart Web Dev Quiz</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#1e3c72,#2a5298);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        .quiz-box{
            background: rgba(0,0,0,0.6);
            padding:30px;
            width:400px;
            border-radius:10px;
            text-align:center;
        }

        h2{
            margin-bottom:15px;
        }

        .option{
            display:block;
            background:#ffffff;
            color:black;
            padding:10px;
            margin:8px 0;
            border-radius:5px;
            cursor:pointer;
        }

        .option:hover{
            background:#ddd;
        }

        #timer{
            font-weight:bold;
            margin-bottom:10px;
            color:yellow;
        }

        button{
            padding:10px 15px;
            border:none;
            background:orange;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }

        #result{
            font-size:20px;
            margin-top:15px;
        }
    </style>
</head>
<body>

<div class="quiz-box">
    <h2>Web Development Quiz</h2>
    <div id="timer">Time Left: 15s</div>
    <div id="question"></div>
    <div id="options"></div>
    <div id="result"></div>
</div>

<script>
const quizData = [
    {
        question: "Which HTML tag is used to include JavaScript?",
        options: ["<js>", "<script>", "<javascript>", "<code>"],
        correct: 1
    },
    {
        question: "Which CSS property is used to change text color?",
        options: ["font-style", "text-color", "color", "background-color"],
        correct: 2
    },
    {
        question: "Which method converts JSON string to object?",
        options: ["JSON.parse()", "JSON.stringify()", "JSON.convert()", "JSON.toObject()"],
        correct: 0
    },
    {
        question: "Which is not a JavaScript data type?",
        options: ["Number", "Boolean", "Float", "String"],
        correct: 2
    },
    {
        question: "Which HTML attribute is used for unique identification?",
        options: ["class", "name", "id", "key"],
        correct: 2
    }
];

let currentQuestion = 0;
let score = 0;
let timeLeft = 15;
let timer;

function loadQuestion(){
    clearInterval(timer);
    timeLeft = 15;
    document.getElementById("timer").innerText = "Time Left: " + timeLeft + "s";

    const q = quizData[currentQuestion];
    document.getElementById("question").innerText = q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option,index)=>{
        const btn = document.createElement("div");
        btn.classList.add("option");
        btn.innerText = option;
        btn.onclick = ()=>checkAnswer(index);
        optionsDiv.appendChild(btn);
    });

    timer = setInterval(()=>{
        timeLeft--;
        document.getElementById("timer").innerText = "Time Left: " + timeLeft + "s";

        if(timeLeft === 0){
            nextQuestion();
        }
    },1000);
}

function checkAnswer(selected){
    if(selected === quizData[currentQuestion].correct){
        score++;
    }
    nextQuestion();
}

function nextQuestion(){
    clearInterval(timer);
    currentQuestion++;

    if(currentQuestion < quizData.length){
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult(){
    document.getElementById("question").innerText = "Quiz Completed!";
    document.getElementById("options").innerHTML = "";
    document.getElementById("timer").innerText = "";
    document.getElementById("result").innerText = 
        "Your Score: " + score + " / " + quizData.length;
}

loadQuestion();
</script>

</body>
</html>
