<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working Image Slider</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.slider{
    position:relative;
    width:1000px;
    height:450px;
    overflow:hidden;
    border-radius:15px;
}

.slides{
    display:flex;
    transition:transform 0.5s ease-in-out;
}

.slide{
    min-width:100%;
    height:450px;
    position:relative;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.content{
    position:absolute;
    bottom:50px;
    left:50px;
    color:white;
}

.content h2{
    margin-bottom:10px;
}

.content button{
    padding:10px 20px;
    border:none;
    background:#ff5722;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

.content button:hover{
    background:#e64a19;
}

.prev, .next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.5);
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    font-size:20px;
}

.prev{ left:10px; }
.next{ right:10px; }

</style>
</head>
<body>

<div class="slider">
    <div class="slides" id="slides">

        <div class="slide">
            <img src="https://picsum.photos/id/1018/800/450">
            <div class="content">
                <h2>Mountains</h2>
                <button>Explore</button>
            </div>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1015/800/450">
            <div class="content">
                <h2>Forest</h2>
                <button>Discover</button>
            </div>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1019/800/450">
            <div class="content">
                <h2>Beach</h2>
                <button>Visit</button>
            </div>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1020/800/450">
            <div class="content">
                <h2>Desert</h2>
                <button>Adventure</button>
            </div>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1021/800/450">
            <div class="content">
                <h2>Waterfall</h2>
                <button>Enjoy</button>
            </div>
        </div>

    </div>

    <button class="prev" id="prevBtn">❮</button>
    <button class="next" id="nextBtn">❯</button>
</div>

<script>

const slides = document.getElementById("slides");
const slide = document.querySelectorAll(".slide");
const totalSlides = slide.length;

let index = 0;

function updateSlide(){
    slides.style.transform = `translateX(-${index * 100}%)`;
}

document.getElementById("nextBtn").addEventListener("click", () => {
    index++;
    if(index >= totalSlides){
        index = 0;
    }
    updateSlide();
});

document.getElementById("prevBtn").addEventListener("click", () => {
    index--;
    if(index < 0){
        index = totalSlides - 1;
    }
    updateSlide();
});


setInterval(() => {
    index++;
    if(index >= totalSlides){
        index = 0;
    }
    updateSlide();
}, 3000);

</script>

</body>
</html>
