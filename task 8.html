<!DOCTYPE html>
<html>
  <head>
  </head>
  <body >
    <h3>Flex Layout </h3>
    <div
      style="
        display: flex;
        flex-direction: column;
        width: 300px;
        background: black;
        padding: 10px;
        gap: 10px;
      "
    >
      <div style="display: flex; gap: 10px">
        <div
          style="background: red; height: 50px; flex: 1; border-radius: 5px"
        ></div>
        <div
          style="background: yellow; height: 50px; flex: 2; border-radius: 5px"
        ></div>
      </div>

      <div style="display: flex; gap: 10px">
        <div
          style="background: purple; height: 50px; flex: 2; border-radius: 5px"
        ></div>
        <div
          style="background: red; height: 50px; flex: 1; border-radius: 5px"
        ></div>
      </div>

      <div style="background: green; height: 50px; border-radius: 5px"></div>

      <div style="background: blue; height: 50px; border-radius: 5px"></div>
    </div>

    <h3>Grid Layout </h3>

    <div
      style="
        display: grid;
        grid-template-columns: repeat(4, 80px);
        grid-template-rows: repeat(4, 80px);
        gap: 10px;
        background: black;
        padding: 10px;
        width: max-content;
      "
    >
      <div
        style="
          background: red;
          grid-column: 1 / 3;
          grid-row: 1 / 2;
          border-radius: 5px;
        "
      ></div>

      <div
        style="
          background: yellow;
          grid-column: 3 / 5;
          grid-row: 1 / 3;
          border-radius: 5px;
        "
      ></div>

 
      <div
        style="
          background: green;
          grid-column: 1 / 2;
          grid-row: 2 / 5;
          border-radius: 5px;
        "
      ></div>
      <div
        style="
          background: blue;
          grid-column: 2 / 3;
          grid-row: 2 / 4;
          border-radius: 5px;
        "
      ></div>

      <div
        style="
          background: red;
          grid-column: 3 / 5;
          grid-row: 3 / 4;
          border-radius: 5px;
        "
      ></div>

      <div
        style="background: purple; grid-column: 2 / 5; grid-row: 4 / 5"
      ></div>
    </div>
  </body>
</html>
