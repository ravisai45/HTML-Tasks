<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrandName</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: white;
      color: #fff;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      background-color: #0e4ead;
    }

    .navbar-brand {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .navbar-links a {
      color: #fff;
      margin-left: 2rem;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.3s ease;
    }

    .navbar-links a:hover {
      opacity: 0.8;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .login {
      background: none;
      color: #aad1ff;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .join-btn {
      background-color: #00aaff;
      color: #fff;
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .join-btn:hover {
      background-color: #0088cc;
    }

    .hero {
      position: relative;
      text-align: center;
      padding: 8rem 5% 6rem;
      background-color: #0e4ead;
      color: white;
      overflow: hidden;
    }

   
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      background-color: white;
      clip-path: polygon(0 100%, 100% 80%, 100% 100%, 0 100%);
    }

    .welcome {
      font-size: 0.9rem;
      font-weight: 600;
      color: #69b2ff;
      margin-bottom: 1rem;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }

    .subtext {
      font-size: 1rem;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 2.5rem;
      opacity: 0.9;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .btn {
      padding: 0.8rem 1.8rem;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: 0.3s ease;
    }

    .btn.primary {
      background-color: #00aaff;
      color: #fff;
    }

    .btn.primary:hover {
      background-color: #0088cc;
    }

    .btn.secondary {
      background-color: transparent;
      color: #aad1ff;
      border: 1px solid #aad1ff;
    }

    .btn.secondary:hover {
      background-color: #aad1ff;
      color: #0e4ead;
    }
  </style>
</head>

<body>
 
  <nav class="navbar">
    <div class="navbar-brand">BrandName</div>
    <div class="navbar-links">
      <a href="#">Home</a>
      <a href="#">Product</a>
      <a href="#">Pricing</a>
      <a href="#">Contact</a>
    </div>
    <div class="actions">
      <button class="login">Login</button>
      <button class="join-btn">Join Us →</button>
    </div>
  </nav>

  <section class="hero">
    <div class="welcome">Welcome</div>
    <h1>Selling on the <br>internet like a pro</h1>
    <p class="subtext">
      We know how large objects will act, but things on a<br> small scale just do not act that way.
    </p>
    <div class="hero-buttons">
      <button class="btn primary">Get Quote Now</button>
      <button class="btn secondary">Learn More</button>
    </div>
  </section>
</body>
</html>
