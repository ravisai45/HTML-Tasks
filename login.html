<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
}



.container{
width:380px;
background:white;
padding:35px;
border-radius:16px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.title{
text-align:center;
margin-bottom:25px;
font-weight:700;
font-size:24px;
color:#333;
}



.input-group{
margin-bottom:15px;
}

.input-group label{
font-size:14px;
font-weight:500;
}

.input-group input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ddd;
border-radius:8px;
outline:none;
}

.input-group input:focus{
border-color:#6366f1;
}



button{
width:100%;
padding:12px;
border:none;
background:#6366f1;
color:white;
font-weight:600;
border-radius:8px;
cursor:pointer;
margin-top:10px;
transition:.3s;
}

button:hover{
background:#4f46e5;
}



.switch{
text-align:center;
margin-top:15px;
font-size:14px;
}

.switch span{
color:#6366f1;
cursor:pointer;
font-weight:600;
}



.dashboard{
display:none;
text-align:center;
color:white;
}

.dashboard h1{
margin-bottom:20px;
}

.logout{
background:white;
color:#6366f1;
}

</style>
</head>

<body>

<div class="container" id="auth-container">

<div class="title" id="form-title">Login</div>



<div id="login-form">

<div class="input-group">
<label>Email</label>
<input type="email" id="loginEmail">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="loginPassword">
</div>

<button onclick="login()">Login</button>

<div class="switch">
Don't have an account? <span onclick="showRegister()">Register</span>
</div>

</div>



<div id="register-form" style="display:none">

<div class="input-group">
<label>Name</label>
<input type="text" id="regName">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="regEmail">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="regPassword">
</div>

<button onclick="register()">Register</button>

<div class="switch">
Already have an account? <span onclick="showLogin()">Login</span>
</div>

</div>

</div>



<div class="dashboard" id="dashboard">

<h1>Welcome 🎉</h1>

<p id="welcomeUser"></p>

<button class="logout" onclick="logout()">Logout</button>

</div>

<script>



function showRegister(){
document.getElementById("login-form").style.display="none";
document.getElementById("register-form").style.display="block";
document.getElementById("form-title").innerText="Register";
}

function showLogin(){
document.getElementById("login-form").style.display="block";
document.getElementById("register-form").style.display="none";
document.getElementById("form-title").innerText="Login";
}


function register(){

let name=document.getElementById("regName").value;
let email=document.getElementById("regEmail").value;
let pass=document.getElementById("regPassword").value;

if(!name || !email || !pass){
alert("Fill all fields");
return;
}

let users=JSON.parse(localStorage.getItem("users"))||[];

let exists=users.find(u=>u.email===email);

if(exists){
alert("User already exists");
return;
}

users.push({name,email,pass});

localStorage.setItem("users",JSON.stringify(users));

alert("Registration Successful");

showLogin();

}



function login(){

let email=document.getElementById("loginEmail").value;
let pass=document.getElementById("loginPassword").value;

let users=JSON.parse(localStorage.getItem("users"))||[];

let user=users.find(u=>u.email===email && u.pass===pass);

if(!user){
alert("Invalid login");
return;
}

localStorage.setItem("loggedUser",JSON.stringify(user));

showDashboard(user);

}



function showDashboard(user){

document.getElementById("auth-container").style.display="none";
document.getElementById("dashboard").style.display="block";

document.getElementById("welcomeUser").innerText="Hello "+user.name;

}



function logout(){

localStorage.removeItem("loggedUser");

location.reload();

}



let logged=JSON.parse(localStorage.getItem("loggedUser"));

if(logged){
showDashboard(logged);
}

</script>

</body>
</html>
